[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gkphomepython"
dynamic = ["version"]
description = "Python API wrapper for GKP Wi-Fi radiators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Théo BRILLAND", email = "theo.brilland@wattswater.com" },
]
keywords = ["gkp", "watts", "radiator", "thermostat", "home automation", "iot"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.8.0,<4.0.0",
    "PyJWT>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/FRRO-WattsElectronics/gkphomepython"
Documentation = "https://github.com/FRRO-WattsElectronics/gkphomepython"
Repository = "https://github.com/FRRO-WattsElectronics/gkphomepython"
"Bug Tracker" = "https://github.com/FRRO-WattsElectronics/gkphomepython/issues"
Changelog = "https://github.com/FRRO-WattsElectronics/gkphomepython/blob/main/README.md#changelog"

[tool.setuptools.packages.find]
where = ["."]
include = ["gkphomepython*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
gkphomepython = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gkphomepython.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
